name: Plant of the Week → Facebook

# Auto-publishes the scheduled post to the Facebook Page Mon/Wed/Fri:
# Mon plant-of-the-week, Wed guess-the-plant close-up, Fri text status. The post content comes from docs/social/calendar.json (generated by
# scripts/gen-social-posts.cjs). Dormant until you add the two secrets below —
# without them the poster runs, finds no token, and exits cleanly.
#
# One-time setup (Settings → Secrets and variables → Actions):
#   FB_PAGE_ID     — your Facebook Page's numeric id
#   FB_PAGE_TOKEN  — a long-lived Page access token (pages_manage_posts scope)
#
# The poster picks the calendar entry whose date == today, so keep the calendar
# dates on Mondays. The active campaign is the Mongolia calendar
# (docs/social/calendar-mongolia.json). Regenerate/extend it any time with:
#   node scripts/gen-social-posts.cjs 2026-07-20 --country mongolia

on:
  schedule:
    - cron: '0 9 * * 1,3,5' # 09:00 UTC Mon/Wed/Fri (17:00 Ulaanbaatar)
  workflow_dispatch:
    inputs:
      week:
        description: 'Force a specific week number (optional)'
        required: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Publish scheduled post
        env:
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          # Posts before this date were scheduled by hand in the FB Planner.
          FB_AUTOPILOT_FROM: '2026-08-17'
        run: |
          if [ -n "${{ inputs.week }}" ]; then
            node scripts/post-to-facebook.cjs --calendar mongolia --week ${{ inputs.week }}
          else
            node scripts/post-to-facebook.cjs --calendar mongolia
          fi
