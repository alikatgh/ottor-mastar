name: Deploy to Cloudflare Pages

# Automatic production deploy: every push to main builds the site and uploads
# it to the "ottormastar" Cloudflare Pages project (apex ottormastar.aulenor.com).
#
# The Pages project is a DIRECT-UPLOAD project (no Git integration), so this
# workflow is what makes pushes go live. One-time setup — add two repo secrets
# (Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN   — a token with the "Cloudflare Pages: Edit" permission
#   CLOUDFLARE_ACCOUNT_ID  — 4c1e57b6972105286a7aeb46b2b89c78 (not secret, but kept here for parity)
# After that, every push to main deploys automatically — no local wrangler needed.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Publish to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=ottormastar --branch=main
