<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Ottor Mastar — Get the app</title>
  <meta name="description" content="Get Ottor Mastar on iPhone, iPad and Mac, or enroll in the Android closed beta. An illustrated herbarium of Yakutia and Mongolia." />
  <meta name="theme-color" content="#2C5A2E" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <style>
    :root { --forest:#2C5A2E; --forest-dark:#1E4020; --cream:#F8F6F0; --ink:#1A1A1A; --ink-muted:#6B6B6B; --hair:rgba(0,0,0,.09); }
    * { box-sizing:border-box; margin:0; padding:0; }
    html,body { background:var(--cream); color:var(--ink);
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
      -webkit-font-smoothing:antialiased; }
    body { min-height:100dvh; display:flex; align-items:center; justify-content:center; padding:24px; }
    .card { width:100%; max-width:26rem; text-align:center; }
    .icon { width:88px; height:88px; border-radius:22px; margin:0 auto 22px;
      box-shadow:0 8px 28px rgba(0,0,0,.14); display:block; }
    .overline { font-size:.72rem; font-weight:600; letter-spacing:.14em; text-transform:uppercase; color:var(--ink-muted); }
    h1 { font-family:Georgia,"Playfair Display",serif; font-size:2.2rem; font-weight:700; margin:.35rem 0 .3rem; }
    .meta { color:var(--ink-muted); font-size:.95rem; margin-bottom:1.7rem; }
    /* Official "Download on the App Store" badge, built to Apple's black variant. */
    .badge { display:inline-flex; align-items:center; gap:.6rem;
      padding:.7rem 1.15rem; border-radius:14px; background:#000; color:#fff;
      text-decoration:none; box-shadow:0 6px 18px rgba(0,0,0,.22);
      transition:transform .05s, box-shadow .15s; }
    .badge:active { transform:scale(.985); }
    .badge svg { width:26px; height:26px; fill:#fff; flex:none; }
    .badge .txt { display:flex; flex-direction:column; line-height:1; text-align:left; }
    .badge .txt small { font-size:.6rem; font-weight:500; letter-spacing:.02em; opacity:.9; }
    .badge .txt strong { font-size:1.25rem; font-weight:600; letter-spacing:-.01em; margin-top:2px; }
    .feats { list-style:none; margin:2rem auto 0; max-width:20rem; text-align:left; }
    .feats li { display:flex; gap:.7rem; align-items:flex-start; padding:.6rem 0; border-top:1px solid var(--hair); font-size:.95rem; line-height:1.4; }
    .feats li:first-child { border-top:none; }
    .feats .dot { flex:none; width:7px; height:7px; border-radius:50%; background:var(--forest); margin-top:.5rem; }
    .foot { margin-top:2rem; font-size:.8rem; }
    .foot a { color:var(--forest); text-decoration:none; }
    .beta { text-align:left; margin-top:2rem; padding:1.25rem; border:1px solid var(--hair); border-radius:16px; }
    .beta h2 { font-size:1.1rem; margin-bottom:.65rem; }
    .beta p,.beta li { font-size:.9rem; line-height:1.5; }
    .beta ol { padding-left:1.25rem; margin:1rem 0; }
    .beta li + li { margin-top:.75rem; }
    .beta a { color:var(--forest); text-underline-offset:3px; }
    .beta .status { color:var(--ink-muted); font-size:.8rem; }
    a:focus-visible { outline:2px solid var(--forest); outline-offset:4px; }
  </style>
</head>
<body>
  <main class="card">
    <img class="icon" alt="Ottor Mastar Sardaana lily logo" src="/icon-512.png" />
    <p class="overline" data-i="over"></p>
    <h1>Ottor Mastar</h1>
    <p class="meta" data-i="meta"></p>

    <a class="badge" href="https://apps.apple.com/app/id6789648576">
      <svg viewBox="0 0 384 512" aria-hidden="true"><path d="M318.7 268.7c-.2-36.7 16.4-64.4 50-84.8-18.8-26.9-47.2-41.7-84.7-44.6-35.5-2.8-74.3 20.7-88.5 20.7-15 0-49.4-19.7-76.4-19.7C63.3 141.2 4 184.8 4 273.5c0 26.2 4.8 53.3 14.4 81.2 12.8 36.7 59 126.7 107.2 125.2 25.2-.6 43-17.9 75.8-17.9 31.8 0 48.3 17.9 76.4 17.9 48.6-.7 90.4-82.5 102.6-119.3-65.2-30.7-61.7-90-61.7-91.9zm-56.6-164.2c27.3-32.4 24.8-61.9 24-72.5-24.1 1.4-52 16.4-67.9 34.9-17.5 19.8-27.8 44.3-25.6 71.9 26.1 2 49.9-11.4 69.5-34.3z"/></svg>
      <span class="txt"><small data-i="badgeSmall"></small><strong>App Store</strong></span>
    </a>

    <section class="beta" aria-labelledby="beta-title">
      <h2 id="beta-title" data-i="betaTitle"></h2>
      <p data-i="betaIntro"></p>
      <ol>
        <li><a href="https://groups.google.com/g/ottormastar-android-testers" data-i="joinGroup"></a><span data-i="sameAccount"></span></li>
        <li><a href="https://play.google.com/apps/testing/com.aulenor.ottormastar" data-i="joinPlay"></a><span data-i="afterApproval"></span></li>
      </ol>
      <p class="status" data-i="betaStatus"></p>
      <p style="margin-top:.75rem"><a href="https://www.facebook.com/ottormastar" data-i="feedback"></a> · <a href="/news" data-i="news"></a></p>
    </section>

    <ul class="feats">
      <li><span class="dot"></span><span data-i="f1"></span></li>
      <li><span class="dot"></span><span data-i="f2"></span></li>
      <li><span class="dot"></span><span data-i="f3"></span></li>
    </ul>

    <p class="foot"><a href="/" data-i="web"></a></p>
  </main>

  <script>
    // Lightweight localization for the app download hub.
    var STR = {
      en: { over:"iPhone · iPad · Mac · Android beta", meta:"Free · Offline catalog",
        badgeSmall:"Download on the",
        betaTitle:"Help test the Android app",
        betaIntro:"The initial closed beta is available to enrolled testers. Update 1.1.0 with the matching iOS lily logo is in review. Join the tester group before the public launch.",
        joinGroup:"Join the tester group", sameAccount:" with the Google account you use on Android.",
        joinPlay:"Opt in on Google Play", afterApproval:" and install the available beta. The latest update appears after approval.",
        betaStatus:"This is a closed test, not an unrestricted open test. If Play says the app is unavailable during review, check back after approval. Stay opted in for 14 continuous days; Google requires 12 testers before we can apply for production access. Group membership alone does not count as Play opt-in.",
        feedback:"Send feedback on Facebook", news:"Read the latest news",
        f1:"53 species from Yakutia and Mongolia, illustrated plate by plate",
        f2:"Names and content in Sakha, Russian, English, Mongolian and Chinese",
        f3:"Bundled catalog works offline; full-resolution images and external resources need internet",
        web:"← Open the website instead" },
      ru: { over:"iPhone · iPad · Mac · Android-бета", meta:"Бесплатно · каталог офлайн",
        badgeSmall:"Загрузите в",
        betaTitle:"Помогите протестировать Android",
        betaIntro:"Первая закрытая бета доступна участникам теста. Обновление 1.1.0 с лилией, как в iOS, проходит проверку. Присоединяйтесь через группу.",
        joinGroup:"Вступите в группу", sameAccount:" с аккаунтом Google, который используете на Android.",
        joinPlay:"Присоединитесь к тесту в Play", afterApproval:" и установите доступную бету. Последнее обновление появится после одобрения.",
        betaStatus:"Это закрытый, а не неограниченный открытый тест. Если приложение недоступно во время проверки, попробуйте после одобрения. Оставайтесь в тесте 14 дней подряд: Google требует 12 тестировщиков перед запросом публичного запуска. Вступление в группу не заменяет участие в тесте через Play.",
        feedback:"Оставить отзыв в Facebook", news:"Последние новости",
        f1:"53 растения Якутии и Монголии с ботаническими иллюстрациями",
        f2:"Названия и материалы на якутском, русском, английском, монгольском и китайском",
        f3:"Встроенный каталог работает офлайн; полные изображения и внешние материалы требуют интернета",
        web:"← Открыть сайт вместо этого" },
      mn: { over:"iPhone · iPad · Mac · Android бета", meta:"Үнэгүй · офлайн каталог",
        badgeSmall:"Татаж авах",
        betaTitle:"Android хувилбарыг хамт туршъя",
        betaIntro:"Эхний хаалттай бета туршигчдад нээлттэй. iOS-той ижил сараана цэцгийн логотой 1.1.0 шинэчлэл хяналтад байна. Туршигчдын бүлгээр элсээрэй.",
        joinGroup:"Бүлэгт элсэх", sameAccount:" — Android дээрээ ашигладаг Google бүртгэлээрээ.",
        joinPlay:"Play дээр туршилтад нэгдэх", afterApproval:" — одоо байгаа бета хувилбарыг суулгана. Зөвшөөрсний дараа шинэчлэл гарна.",
        betaStatus:"Энэ нь хаалттай туршилт. Хяналтын үед апп нээгдэхгүй бол зөвшөөрөл гарсны дараа дахин шалгаарай. Туршилтад 14 өдөр дараалан бүртгэлтэй байгаарай: нийтэд гаргах эрх хүсэхийн өмнө Google 12 туршигч шаарддаг. Бүлэгт элсэх нь Play дээр нэгдэхийг орлохгүй.",
        feedback:"Facebook-д санал хүсэлт өгөх", news:"Сүүлийн мэдээ",
        f1:"Якут, Монголын 53 зүйл ургамал, ботаникийн зурагтай",
        f2:"Саха, орос, англи, монгол, хятад хэлээр",
        f3:"Каталог офлайн ажиллана; өндөр нягтралтай зураг болон гадаад материалд интернет хэрэгтэй",
        web:"← Вэбсайтыг нээх" }
    };
    var preferred = (navigator.language || "en").toLowerCase().split("-")[0];
    var lang = STR[preferred] ? preferred : "en";
    document.documentElement.lang = lang;
    var d = STR[lang];
    document.querySelectorAll("[data-i]").forEach(function(el){ el.textContent = d[el.getAttribute("data-i")] || ""; });
  </script>
</body>
</html>
