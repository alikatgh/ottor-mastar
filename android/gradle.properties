# AndroidX + Compose
android.useAndroidX=true
org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.configuration-cache=true
kotlin.code.style=official

# Machine-specific: AGP/Kotlin need JDK 17; the system `java` on this Mac is
# absent and Homebrew's default is JDK 26 (too new). Adjust per machine or
# remove if JAVA_HOME already points at a JDK 17–21.
org.gradle.java.home=/opt/homebrew/opt/openjdk@17
