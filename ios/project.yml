# XcodeGen manifest — regenerate the project with:  cd ios && xcodegen
# (project.pbxproj is generated; this file is the source of truth.)
name: OttorMastar
options:
  bundleIdPrefix: com.aulenor
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_LANGUAGE: en
targets:
  OttorMastar:
    type: application
    platform: iOS
    sources:
      - path: OttorMastar/Sources
      # Blue folder reference: lands in the bundle as PlantImages/, preserving
      # {plants,mongolia}/{thumb,medium}/*.webp paths. NOTE: must NOT be a
      # directory literally named "Resources" — that makes iOS treat the .app
      # as a macOS-style deep bundle and install fails with "Missing bundle ID".
      - path: OttorMastar/Resources/PlantImages
        type: folder
        buildPhase: resources
      - path: OttorMastar/Resources/plants.json
        buildPhase: resources
      - path: OttorMastar/Resources/locale-sah.json
        buildPhase: resources
      - path: OttorMastar/Resources/locale-ru.json
        buildPhase: resources
      - path: OttorMastar/Resources/locale-en.json
        buildPhase: resources
      - path: OttorMastar/Resources/locale-mn.json
        buildPhase: resources
      - path: OttorMastar/Resources/locale-zh.json
        buildPhase: resources
      # App icon asset catalog (single 1024² universal icon).
      - path: OttorMastar/Resources/Assets.xcassets
      # Apple privacy manifest — required for App Store submission.
      - path: OttorMastar/Resources/PrivacyInfo.xcprivacy
        buildPhase: resources
    info:
      path: OttorMastar/Info.plist
      properties:
        CFBundleDisplayName: Ottor Mastar
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aulenor.ottormastar
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        ENABLE_USER_SCRIPT_SANDBOXING: true
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
