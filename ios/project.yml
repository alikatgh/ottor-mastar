# XcodeGen manifest — regenerate the project with:  cd ios && xcodegen
# (project.pbxproj is generated; this file is the source of truth.)
name: OttorMastar
options:
  bundleIdPrefix: com.aulenor
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    # 1.1: Sardaana-lily brand icon + OTA catalog sync; first macOS (Catalyst)
    # release. ASC build numbers are per-platform, so both upload as 1.1 (2).
    MARKETING_VERSION: "1.1"
    CURRENT_PROJECT_VERSION: "2"
    DEVELOPMENT_LANGUAGE: en
targets:
  OttorMastar:
    type: application
    platform: iOS
    sources:
      - path: OttorMastar/Sources
      # Blue folder reference: lands in the bundle as PlantImages/, preserving
      # {plants,mongolia}/{thumb,medium}/*.webp paths. NOTE: must NOT be a
      # directory literally named "Resources" — that makes iOS treat the .app
      # as a macOS-style deep bundle and install fails with "Missing bundle ID".
      - path: OttorMastar/Resources/PlantImages
        type: folder
        buildPhase: resources
      - path: OttorMastar/Resources/plants.json
        buildPhase: resources
      - path: OttorMastar/Resources/locale-sah.json
        buildPhase: resources
      - path: OttorMastar/Resources/locale-ru.json
        buildPhase: resources
      - path: OttorMastar/Resources/locale-en.json
        buildPhase: resources
      - path: OttorMastar/Resources/locale-mn.json
        buildPhase: resources
      - path: OttorMastar/Resources/locale-zh.json
        buildPhase: resources
      # App icon asset catalog (single 1024² universal icon).
      - path: OttorMastar/Resources/Assets.xcassets
      # Apple privacy manifest — required for App Store submission.
      - path: OttorMastar/Resources/PrivacyInfo.xcprivacy
        buildPhase: resources
    info:
      path: OttorMastar/Info.plist
      properties:
        CFBundleDisplayName: Ottor Mastar
        # Bind to the build settings above — xcodegen preserves stale literal
        # values otherwise, and the shipped version silently stops matching.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        ITSAppUsesNonExemptEncryption: false
        # Mac App Store upload validation rejects archives without a category.
        LSApplicationCategoryType: public.app-category.education
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aulenor.ottormastar
        DEVELOPMENT_TEAM: 9M2B2P4KSA
        # 6 = Mac (Catalyst "Optimize for Mac" idiom): 100% scale, crisp text,
        # native control metrics — instead of the blurry scaled-iPad rendering.
        TARGETED_DEVICE_FAMILY: "1,2,6"
        CODE_SIGN_STYLE: Automatic
        ENABLE_USER_SCRIPT_SANDBOXING: true
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # macOS port: the same SwiftUI app runs as a native Mac app via
        # Mac Catalyst (build with -destination 'generic/platform=macOS,variant=Mac Catalyst').
        SUPPORTS_MACCATALYST: YES
        # SAME bundle id on the Mac — the Catalyst build must land on the
        # existing ASC app record (6789648576) as a universal purchase; the
        # derived "maccatalyst." prefix would demand a separate app record.
        DERIVE_MACCATALYST_PRODUCT_BUNDLE_IDENTIFIER: NO
        # Mac App Store requires the App Sandbox — Catalyst builds only
        # (iOS profiles reject the sandbox entitlement, so scope by sdk).
        CODE_SIGN_ENTITLEMENTS[sdk=macosx*]: OttorMastar/OttorMastar.entitlements
